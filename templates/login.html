<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo System Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #000000; margin: 0; color: #f5f7fa; }
        .container { max-width: 420px; margin: 80px auto; background: #141414; padding: 24px; border-radius: 12px; box-shadow: 0 10px 22px rgba(0,0,0,.65); border: 0; }
        h1 { margin-top: 0; font-size: 22px; }
        label { display: block; margin-top: 14px; font-weight: 600; }
        input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 0; border-radius: 8px; background: #222222; color: #f5f7fa; }
        button { margin-top: 18px; width: 100%; background: #ffffff; color: #000000; border: 0; padding: 11px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .flash { margin-top: 12px; padding: 10px; border-radius: 8px; background: #333333; color: #ffffff; border: 0; }
        .help { color: #d9d9d9; margin-top: 14px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Promo Code System</h1>
        <p>Staff login is required.</p>
        <form method="post" action="/login">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Login</button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- <div class="help">
            Set secure credentials with environment variables: `PROMO_ADMIN_USER` and `PROMO_ADMIN_PASSWORD`.
        </div> -->
    </div>
</body>
</html>
